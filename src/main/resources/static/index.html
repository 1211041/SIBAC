<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SIBAC - Sistema Pericial para Diagnóstico de Anomalias em Sistemas Energéticos Industriais. Chatbot de diagnóstico inteligente.">
    <title>SIBAC — Diagnóstico Inteligente</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>

    <div class="chat-container" id="chatContainer">
        <!-- Header -->
        <header class="chat-header">
            <div class="chat-header-icon">⚡</div>
            <div class="chat-header-info">
                <h1 class="chat-header-title">SIBAC — Assistente de Diagnóstico</h1>
                <p class="chat-header-subtitle">
                    <span class="status-dot"></span>
                    Sistema Pericial Online
                </p>
            </div>
        </header>

        <!-- Progress Bar -->
        <div class="progress-bar-container" id="progressBarContainer">
            <div class="progress-info">
                <span class="progress-label">Progresso do Diagnóstico</span>
                <span class="progress-count" id="progressCount">0 / 8</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Messages Area -->
        <main class="chat-messages" id="chatMessages">
            <!-- Messages will be injected here by JS -->
        </main>

        <!-- Footer -->
        <footer class="chat-footer">
            <p>Powered by <span>Drools Engine</span> · SIBAC Expert System · ISEP</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
